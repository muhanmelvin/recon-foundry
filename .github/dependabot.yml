# Monthly, grouped. Weekly ungrouped updates generate the pile of open PRs that
# makes a public profile look abandoned — which is the actual risk here, since
# the runtime dependency surface of these apps is close to zero.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
